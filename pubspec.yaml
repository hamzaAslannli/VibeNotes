name: vibe_notes
description: A minimalist voice note app with AI capabilities.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.0
  just_audio: ^0.9.46
  record: ^6.0.0
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.0
  http: ^1.2.0
  flutter_markdown: ^0.7.0
  share_plus: ^10.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
